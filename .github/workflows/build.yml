# Automatically build the project and run any configured tests for every push
# and submitted pull request. Successful builds on master are published as a
# pre-release on GitHub and as an alpha version on Modrinth.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup JDK 25 for Minecraft 26.x
        if: matrix.shard == 4 || matrix.shard == 8
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup JDK 16 for Minecraft 1.17.1
        if: matrix.shard == 5
        uses: actions/setup-java@v5
        with:
          java-version: '16'
          distribution: 'temurin'
      - name: setup JDK 17 for ForgeGradle 5
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: record Forge Java home
        run: echo "FORGE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew versions/*/gradlew
      - name: verify generated sources
        if: matrix.shard == 0
        run: |
          python3 scripts/generate_common_sources.py
          python3 scripts/generate_forge_projects.py
          python3 scripts/generate_neoforge_projects.py
          git diff --exit-code
      - name: run unit tests
        run: ./gradlew :tests:test --no-daemon
      - name: build and collect all versions
        run: ./gradlew verifyReleases -PbuildShard=${{ matrix.shard }} -PbuildShardCount=9
      - name: report mixin refmap targets
        run: |
          # The refmap is the exact name Mixin looks for at runtime, so two
          # versions can only share a Forge jar when these mappings match.
          # NeoForge and Forge 1.20.6 ship no refmap at all, which means those
          # mixins resolve by literal name and are already version independent.
          for jar in build/releases/*.jar; do
            refmap=$(unzip -p "$jar" customsplash.refmap.json 2>/dev/null || true)
            if [ -n "$refmap" ]; then
              printf '%s\n' "$(basename "$jar") -> $(printf '%s' "$refmap" | python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin).get("mappings",{}),sort_keys=True))' 2>/dev/null || echo unreadable)"
            else
              printf '%s\n' "$(basename "$jar") -> no refmap (literal names)"
            fi
          done | sort
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.shard }}
          path: build/releases/
          if-no-files-found: warn

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The build job only proves a merged jar compiles; booting the real client
        # proves the mixin can actually be applied on the releases the jar claims.
        # Every row is the newest release of a line, which is where a bad merge
        # shows up first, and the fabric rows also cover the oldest so both ends of
        # a line are checked. This gates the release below.
        #
        # MC-Runtime-Test publishes one asset per Minecraft release, and a few
        # releases on these lines have none: 1.14-1.16.4, 1.17, 1.18, 1.18.1,
        # 1.20, the 1.20.5 NeoForge line and 26.3. Those still need a manual smoke
        # test, so a row uses the nearest release that does have an asset (1.20.1
        # rather than 1.20, 26.2 rather than 26.3).
        include:
          # Fabric. The jar globs carry the loader flavour ("+mc" rather than
          # "+forge-mc"), because a bare "custom-splash-1.20-*" would also match
          # the 1.20-forge jar and the stage step would refuse to pick one.
          - { mc: '1.16.5',  modloader: 'fabric',   runtime: 'fabric',   java: '8',  jar: 'custom-splash-1.14.4-*+mc*.jar' }
          - { mc: '1.19.4',  modloader: 'fabric',   runtime: 'fabric',   java: '17', jar: 'custom-splash-1.14.4-*+mc*.jar' }
          - { mc: '1.20.1',  modloader: 'fabric',   runtime: 'fabric',   java: '17', jar: 'custom-splash-1.20-*+mc*.jar' }
          - { mc: '1.21.11', modloader: 'fabric',   runtime: 'fabric',   java: '21', jar: 'custom-splash-1.20-*+mc*.jar' }
          - { mc: '26.1.2',  modloader: 'fabric',   runtime: 'fabric',   java: '25', jar: 'custom-splash-26.1-*+mc*.jar' }
          - { mc: '26.2',    modloader: 'fabric',   runtime: 'fabric',   java: '25', jar: 'custom-splash-26.2-*+mc*.jar' }
          # Forge, one row per line; the merged 1.17.1-1.19.4 line gets both ends
          # plus the popular 1.18.2 in between.
          - { mc: '1.16.5',  modloader: 'forge',    runtime: 'lexforge', java: '8',  jar: 'custom-splash-1.16.1-forge-*+forge-mc*.jar' }
          - { mc: '1.17.1',  modloader: 'forge',    runtime: 'lexforge', java: '16', jar: 'custom-splash-1.17.1-forge-*+forge-mc*.jar' }
          - { mc: '1.18.2',  modloader: 'forge',    runtime: 'lexforge', java: '17', jar: 'custom-splash-1.17.1-forge-*+forge-mc*.jar' }
          - { mc: '1.19.4',  modloader: 'forge',    runtime: 'lexforge', java: '17', jar: 'custom-splash-1.17.1-forge-*+forge-mc*.jar' }
          - { mc: '1.20.4',  modloader: 'forge',    runtime: 'lexforge', java: '17', jar: 'custom-splash-1.20-forge-*+forge-mc*.jar' }
          - { mc: '1.20.6',  modloader: 'forge',    runtime: 'lexforge', java: '21', jar: 'custom-splash-1.20.6-forge-*+forge-mc*.jar' }
          # The 1.20-1.20.4 jar declares versionRange "[1.20,1.21)", which also
          # covers 1.20.6, but 1.20.6 ships no refmap because Forge resolves
          # official names there while the 1.20 line maps getSplash to m_280369_.
          # Boot that jar on 1.20.6 rather than assume the overlap is harmless; if
          # it fails, the 1.20 line's range has to stop below 1.20.6.
          - { mc: '1.20.6',  modloader: 'forge',    runtime: 'lexforge', java: '21', jar: 'custom-splash-1.20-forge-*+forge-mc*.jar' }
          # NeoForge, one row per line.
          - { mc: '1.21.4',  modloader: 'neoforge', runtime: 'neoforge', java: '21', jar: 'custom-splash-1.21-neoforge-*+neoforge-mc*.jar' }
          - { mc: '1.21.11', modloader: 'neoforge', runtime: 'neoforge', java: '21', jar: 'custom-splash-1.21.5-neoforge-*+neoforge-mc*.jar' }
          - { mc: '26.2',    modloader: 'neoforge', runtime: 'neoforge', java: '25', jar: 'custom-splash-26.1-neoforge-*+neoforge-mc*.jar' }
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: jars-*
          merge-multiple: true
          path: build/releases/
      - name: stage the mod jar
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=(build/releases/${{ matrix.jar }})
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::expected one jar matching build/releases/${{ matrix.jar }}, found ${#matches[@]}"
            ls -l build/releases || true
            exit 1
          fi
          mkdir -p run/mods
          cp "${matches[0]}" run/mods/
          ls -l run/mods
      - name: run the Minecraft client
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.modloader }}
          # HeadlessMC picks the installed loader by matching its version name.
          regex: .*${{ matrix.modloader }}.*
          mc-runtime-test: ${{ matrix.runtime }}
          java: ${{ matrix.java }}
          fabric-api: none
          dummy-assets: true
          cache-mc: github
      # The client writes its crash report and log into run/ and the runner is
      # thrown away, which makes a failure like the 1.16.5 loading error screen
      # impossible to diagnose after the fact. Keep them.
      - name: upload what the client wrote
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ strategy.job-index }}-${{ matrix.mc }}-${{ matrix.modloader }}
          path: |
            run/crash-reports/
            run/logs/latest.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: jars-*
          merge-multiple: true
          path: build/releases/
      - name: verify complete release
        run: python3 scripts/verify_release_artifacts.py build/releases
      - name: compute mod version
        run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: sync modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          python3 scripts/update_modrinth_page.py
      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$MOD_VERSION-build${{ github.run_number }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" build/releases/*.jar --clobber
          else
            gh release create "$tag" build/releases/*.jar --title "Custom Splash $MOD_VERSION (build ${{ github.run_number }})" --prerelease --generate-notes
          fi
      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          curl -fsS "https://api.modrinth.com/v3/project/$MODRINTH_ID/version" -o "$RUNNER_TEMP/modrinth-versions.json"
          failed=0
          for file in build/releases/*.jar; do
            if unzip -l "$file" | grep -q "META-INF/neoforge.mods.toml"; then
              loader="neoforge"
              targets_file="neoforge-targets.txt"
              version=$(unzip -p "$file" META-INF/neoforge.mods.toml | sed -nE 's/^version="(.*)"$/\1/p' | head -1)
            elif unzip -l "$file" | grep -q "META-INF/mods.toml"; then
              loader="forge"
              targets_file="forge-targets.txt"
              version=$(unzip -p "$file" META-INF/mods.toml | sed -nE 's/^version="(.*)"$/\1/p' | head -1)
            else
              loader="fabric"
              targets_file="fabric-targets.txt"
              meta=$(unzip -p "$file" fabric.mod.json)
              version=$(printf '%s' "$meta" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            fi
            # One jar covers a whole release line, so publish every release it
            # declares. The project name sits between the prefix and the mod
            # version, e.g. custom-splash-1.16.1-forge-1.2.0+forge-mc1.16.1.<sha>.
            project=$(basename "$file" | sed -E 's/^custom-splash-(.+)-[0-9]+\.[0-9]+\.[0-9]+\+.*/\1/')
            mc_versions=$(python3 -c "import json,sys;t={l.split()[0]:l.split()[2:] for l in open(sys.argv[2]) if l.strip() and not l.startswith('#')};print(json.dumps(t[sys.argv[1]]))" "$project" "$targets_file")
            if [ "${#version}" -gt 32 ] && printf '%s' "$version" | grep -qE '\.[0-9a-f]{8}$'; then
              # Modrinth caps version_number at 32 characters; drop the commit suffix
              version="${version%.*}"
            fi
            if python3 - "$RUNNER_TEMP/modrinth-versions.json" "$version" <<'PY'
          import json, sys
          versions = json.load(open(sys.argv[1]))
          sys.exit(0 if any(v['version_number'] == sys.argv[2] for v in versions) else 1)
          PY
            then
              echo "skipping existing Modrinth version $version"
              continue
            fi
            echo "publishing $file for Minecraft $mc_versions ($loader) as $version"
            published=false
            limit_reached=false
            for attempt in 1 2 3; do
              if curl --fail-with-body -sS -X POST "https://api.modrinth.com/v3/version" \
                -H "Authorization: $MODRINTH_TOKEN" \
                -F "data={\"project_id\":\"$MODRINTH_ID\",\"version_number\":\"$version\",\"version_title\":\"$version\",\"version_type\":\"alpha\",\"changelog\":\"\",\"dependencies\":[],\"game_versions\":$mc_versions,\"loaders\":[\"$loader\"],\"environment\":\"client_or_server\",\"featured\":false,\"file_parts\":[\"file\"],\"primary_file\":\"file\"};type=application/json" \
                -F "file=@$file;type=application/java-archive" -o "$RUNNER_TEMP/modrinth-response.json"
              then
                published=true
                break
              fi
              echo "attempt $attempt for $version failed; Modrinth response:"
              cat "$RUNNER_TEMP/modrinth-response.json" 2>/dev/null || true
              if grep -q '"error":"limit_reached"' "$RUNNER_TEMP/modrinth-response.json" 2>/dev/null; then
                limit_reached=true
                break
              fi
              sleep 10
            done
            if [ "$published" != "true" ]; then
              if [ "$limit_reached" = "true" ]; then
                echo "::warning::Modrinth daily version upload limit (150/day, UTC) reached; deferring the remaining uploads"
                if [ "$failed" -ne 0 ]; then
                  echo "::error::$failed Modrinth upload(s) failed before the limit was reached"
                  exit 1
                fi
                exit 0
              fi
              echo "::error::Failed to publish $version to Modrinth"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed Modrinth upload(s) failed"
            exit 1
          fi
