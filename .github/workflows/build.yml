# Automatically build the project and run any configured tests for every push
# and submitted pull request. Successful builds on master are published as a
# pre-release on GitHub and as an alpha version on Modrinth.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # ForgeGradle 5 projects (Minecraft 1.16.5 to 1.20.1) need a JDK the
      # plugin actually accepts.
      - name: setup JDK 17 for ForgeGradle 5
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      # Minecraft 26.x runs on JDK 25, which every shard can contain.
      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew versions/*/gradlew forge/*/gradlew neoforge/*/gradlew
      - name: build and collect all versions
        run: ./gradlew verifyReleases -PbuildShard=${{ matrix.shard }} -PbuildShardCount=6
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.shard }}
          path: build/releases/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: jars-*
          merge-multiple: true
          path: build/releases/
      - name: verify complete release
        run: python3 scripts/verify_release_artifacts.py build/releases
      - name: compute mod version
        run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$MOD_VERSION-build${{ github.run_number }}" build/releases/*.jar --title "Custom Splash $MOD_VERSION (build ${{ github.run_number }})" --prerelease --generate-notes
      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: python3 scripts/publish_modrinth.py build/releases
      - name: refresh modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          python3 - "$MODRINTH_ID" <<'PY'
          import json, os, sys, urllib.request
          project_id, token = sys.argv[1], os.environ["MODRINTH_TOKEN"]
          body = json.dumps({"description": open("MODRINTH.md", encoding="utf-8").read()}).encode()
          request = urllib.request.Request(
              f"https://api.modrinth.com/v3/project/{project_id}",
              data=body,
              headers={"Authorization": token, "Content-Type": "application/json", "User-Agent": "custom-splash/release-script"},
              method="PATCH",
          )
          with urllib.request.urlopen(request) as response:
              print("modrinth description updated:", response.status)
          PY
