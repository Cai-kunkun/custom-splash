# Automatically build the project and run any configured tests for every push
# and submitted pull request. Successful builds on master are published as a
# pre-release on GitHub and as an alpha version on Modrinth.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew versions/*/gradlew
      - name: build and collect all versions
        run: ./gradlew collectJars
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/releases/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          path: build/releases/
      - name: compute version metadata
        run: |
          echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - name: publish github release and modrinth
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.MOD_VERSION }}-build${{ github.run_number }}
          github-prerelease: true
          github-generate-release-notes: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          version: ${{ env.MOD_VERSION }}+${{ env.SHORT_SHA }}
          version-type: alpha
          files: build/releases/*.jar
