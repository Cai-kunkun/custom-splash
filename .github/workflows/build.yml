# Automatically build the project and run any configured tests for every push
# and submitted pull request. Successful builds on master are published as a
# pre-release on GitHub and as an alpha version on Modrinth.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup JDK 25 for Minecraft 26.x
        if: matrix.shard == 4 || matrix.shard == 8
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup JDK 16 for Minecraft 1.17.1
        if: matrix.shard == 5
        uses: actions/setup-java@v5
        with:
          java-version: '16'
          distribution: 'temurin'
      - name: setup JDK 17 for ForgeGradle 5
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: record Forge Java home
        run: echo "FORGE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew versions/*/gradlew
      - name: verify generated sources
        if: matrix.shard == 0
        run: |
          python3 scripts/generate_common_sources.py
          python3 scripts/generate_forge_projects.py
          python3 scripts/generate_neoforge_projects.py
          git diff --exit-code
      - name: run unit tests
        run: ./gradlew :tests:test --no-daemon
      - name: build and collect all versions
        run: ./gradlew verifyReleases -PbuildShard=${{ matrix.shard }} -PbuildShardCount=9
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.shard }}
          path: build/releases/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: jars-*
          merge-multiple: true
          path: build/releases/
      - name: verify complete release
        run: python3 scripts/verify_release_artifacts.py build/releases
      - name: compute mod version
        run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: sync modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          python3 scripts/update_modrinth_page.py
      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$MOD_VERSION-build${{ github.run_number }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" build/releases/*.jar --clobber
          else
            gh release create "$tag" build/releases/*.jar --title "Custom Splash $MOD_VERSION (build ${{ github.run_number }})" --prerelease --generate-notes
          fi
      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          curl -fsS "https://api.modrinth.com/v3/project/$MODRINTH_ID/version" -o "$RUNNER_TEMP/modrinth-versions.json"
          failed=0
          for file in build/releases/*.jar; do
            if unzip -l "$file" | grep -q "META-INF/neoforge.mods.toml"; then
              loader="neoforge"
              version=$(unzip -p "$file" META-INF/neoforge.mods.toml | sed -nE 's/^version="(.*)"$/\1/p' | head -1)
              mc_version=$(basename "$file" | sed -E 's/^custom-splash-([0-9.]+)-neoforge-.*/\1/')
            elif unzip -l "$file" | grep -q "META-INF/mods.toml"; then
              loader="forge"
              version=$(unzip -p "$file" META-INF/mods.toml | sed -nE 's/^version="(.*)"$/\1/p' | head -1)
              mc_version=$(basename "$file" | sed -E 's/^custom-splash-([0-9.]+)-forge-.*/\1/')
            else
              loader="fabric"
              meta=$(unzip -p "$file" fabric.mod.json)
              version=$(printf '%s' "$meta" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
              mc_version=$(printf '%s' "$meta" | python3 -c "import json,sys;print(json.load(sys.stdin)['depends']['minecraft'].lstrip('='))")
            fi
            if python3 - "$RUNNER_TEMP/modrinth-versions.json" "$version" <<'PY'
          import json, sys
          versions = json.load(open(sys.argv[1]))
          sys.exit(0 if any(v['version_number'] == sys.argv[2] for v in versions) else 1)
          PY
            then
              echo "skipping existing Modrinth version $version"
              continue
            fi
            echo "publishing $file for Minecraft $mc_version ($loader) as $version"
            published=false
            limit_reached=false
            for attempt in 1 2 3; do
              if curl --fail-with-body -sS -X POST "https://api.modrinth.com/v3/version" \
                -H "Authorization: $MODRINTH_TOKEN" \
                -F "data={\"project_id\":\"$MODRINTH_ID\",\"version_number\":\"$version\",\"version_title\":\"$version\",\"version_type\":\"alpha\",\"changelog\":\"\",\"dependencies\":[],\"game_versions\":[\"$mc_version\"],\"loaders\":[\"$loader\"],\"environment\":\"client_or_server\",\"featured\":false,\"file_parts\":[\"file\"],\"primary_file\":\"file\"};type=application/json" \
                -F "file=@$file;type=application/java-archive" -o "$RUNNER_TEMP/modrinth-response.json"
              then
                published=true
                break
              fi
              echo "attempt $attempt for $version failed; Modrinth response:"
              cat "$RUNNER_TEMP/modrinth-response.json" 2>/dev/null || true
              if grep -q '"error":"limit_reached"' "$RUNNER_TEMP/modrinth-response.json" 2>/dev/null; then
                limit_reached=true
                break
              fi
              sleep 10
            done
            if [ "$published" != "true" ]; then
              if [ "$limit_reached" = "true" ]; then
                echo "::warning::Modrinth daily version upload limit (150/day, UTC) reached; deferring the remaining uploads"
                if [ "$failed" -ne 0 ]; then
                  echo "::error::$failed Modrinth upload(s) failed before the limit was reached"
                  exit 1
                fi
                exit 0
              fi
              echo "::error::Failed to publish $version to Modrinth"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed Modrinth upload(s) failed"
            exit 1
          fi
