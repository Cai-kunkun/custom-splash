# Automatically build the project and run any configured tests for every push
# and submitted pull request. Successful builds on master are published as a
# pre-release on GitHub and as an alpha version on Modrinth.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew versions/*/gradlew
      - name: build and collect all versions
        run: ./gradlew collectJars
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/releases/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          path: build/releases/
      - name: compute mod version
        run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$MOD_VERSION-build${{ github.run_number }}" build/releases/*.jar --title "Custom Splash $MOD_VERSION (build ${{ github.run_number }})" --prerelease --generate-notes
      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_ID" ]; then
            echo "Modrinth token or project id not configured, skipping"
            exit 0
          fi
          for file in build/releases/*.jar; do
            meta=$(unzip -p "$file" fabric.mod.json)
            version=$(printf '%s' "$meta" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            mc_version=$(printf '%s' "$meta" | python3 -c "import json,sys;print(json.load(sys.stdin)['depends']['minecraft'].lstrip('='))")
            echo "publishing $file for Minecraft $mc_version as $version"
            curl --fail-with-body -sS -X POST "https://api.modrinth.com/v3/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data={\"project_id\":\"$MODRINTH_ID\",\"version_number\":\"$version\",\"version_title\":\"$version\",\"version_type\":\"alpha\",\"changelog\":\"\",\"dependencies\":[],\"game_versions\":[\"$mc_version\"],\"loaders\":[\"fabric\"],\"environment\":\"client_or_server\",\"featured\":false,\"file_parts\":[\"file\"],\"primary_file\":\"file\"};type=application/json" \
              -F "file=@$file;type=application/java-archive"
          done
