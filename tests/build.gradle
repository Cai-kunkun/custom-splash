plugins {
	id 'java'
}

// The mod keeps one copy of every shared class per build target, all of them
// byte-for-byte identical because they are generated by
// scripts/generate_common_sources.py. The unit tests therefore compile one copy
// instead of duplicating the sources for every target.
def sharedSource = file("../versions/26.3/src/main/java")

sourceSets {
	main {
		java {
			srcDir sharedSource
			exclude 'dev/arrbrants/customsplash/mixin/**'
			exclude 'dev/arrbrants/customsplash/CustomSplash.java'
		}
	}
}

repositories {
	maven {
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'net.fabricmc:fabric-loader:0.19.5'

	testImplementation platform('org.junit:junit-bom:5.10.5')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The mod ships for Java 8 targets (Minecraft 1.14) up to Java 25 (26.x).
// Compiling the shared classes with release 8 proves they stay portable.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
