plugins {
	id 'base'
}

def minecraftVersions = [
	'1.20.1', '1.20.2', '1.20.4', '1.20.6', '1.21', '1.21.1',
	'1.21.4', '1.21.5', '1.21.8', '26.1', '26.2'
]

def versionBuilds = minecraftVersions.collect { minecraftVersion ->
	tasks.register("buildMc${minecraftVersion.replace('.', '_')}", Exec) {
		def versionDirectory = file("versions/${minecraftVersion}")
		group = 'build'
		description = "Builds Custom Splash for Minecraft ${minecraftVersion}."
		workingDir versionDirectory
		commandLine './gradlew', 'build', '--no-daemon'
		inputs.files(fileTree(versionDirectory) {
			include 'build.gradle', 'settings.gradle', 'gradle.properties', 'src/**'
		})
		outputs.dir file("versions/${minecraftVersion}/build/libs")
	}
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every supported Minecraft version.'
	dependsOn versionBuilds
}

tasks.register('collectJars', Copy) {
	group = 'build'
	description = 'Collects all remapped version jars into build/releases.'
	dependsOn versionBuilds
	from(minecraftVersions.collect { file("versions/${it}/build/libs") }) {
		exclude '*-sources.jar'
	}
	into layout.buildDirectory.dir('releases')
}

tasks.named('build') {
	dependsOn tasks.named('collectJars')
}
