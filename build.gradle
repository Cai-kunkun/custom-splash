import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
	id 'base'
}

// Every loader is built once per release line. Its targets file maps each project
// to the whole range of releases its single jar covers, using the same format:
//   <project> <compile-against> <covered minecraft versions...>
def readList = { String fileName ->
	file(fileName).readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
}
def supportedVersions = readList('supported-versions.txt')
def supportedForge = readList('supported-forge-versions.txt')
def supportedNeoForge = readList('supported-neoforge-versions.txt')

def readTargets = { String fileName, String loader, List expected ->
	def targets = file(fileName).readLines()
		.collect { it.trim() }
		.findAll { it && !it.startsWith('#') }
		.collect { line ->
			def parts = line.split(/\s+/)
			if (parts.length < 3) {
				throw new GradleException("Malformed target line in ${fileName}: ${line}")
			}
			[name: parts[0], compile: parts[1], covered: parts[2..-1]]
		}
	def listed = targets.collectMany { it.covered }
	if (listed != expected) {
		throw new GradleException("${fileName} must list every supported ${loader} release exactly once, in order")
	}
	targets.collect { [name: it.name, loader: loader, minecraft: it.compile, covered: it.covered] }
}

def allTargets = readTargets('fabric-targets.txt', 'fabric', supportedVersions) +
	readTargets('forge-targets.txt', 'forge', supportedForge) +
	readTargets('neoforge-targets.txt', 'neoforge', supportedNeoForge)
def fabricSet = supportedVersions.toSet()
allTargets.findAll { it.loader != 'fabric' }.each { target ->
	target.covered.each { mc ->
		if (!fabricSet.contains(mc)) {
			throw new GradleException("Minecraft ${mc} is not a Fabric release")
		}
	}
}

// What a Fabric jar declares in fabric.mod.json, e.g. ">=1.20 <=1.21.11". Forge
// and NeoForge declare a Maven range in their metadata instead, so those only
// have their lower bound checked here; verify_release_artifacts.py checks the
// whole set once the release is assembled.
def fabricPredicate = { target -> ">=${target.covered.first()} <=${target.covered.last()}" }
def mcLowerBound = { target -> "versionRange=\"[${target.covered.first()}," }

def projectDirs = file('versions').listFiles()
	.findAll { it.isDirectory() && new File(it, 'build.gradle').isFile() }
	.collect { it.name }
def expectedNames = allTargets.collect { it.name }
if (expectedNames.toSet().size() != expectedNames.size() || projectDirs.toSet() != expectedNames.toSet()) {
	throw new GradleException('fabric-targets.txt, supported-forge-versions.txt and supported-neoforge-versions.txt must list each version project exactly once')
}

def shard = providers.gradleProperty('buildShard').orNull
def shardCount = providers.gradleProperty('buildShardCount').orNull
if ((shard == null) != (shardCount == null)) {
	throw new GradleException('Specify both buildShard and buildShardCount, or neither')
}
def targets = allTargets
if (shard != null) {
	def index = Integer.parseInt(shard)
	def count = Integer.parseInt(shardCount)
	if (count < 1 || index < 0 || index >= count || count > allTargets.size()) {
		throw new GradleException('Invalid build shard: buildShard must be in [0, buildShardCount)')
	}
	// Round-robin, so a shard is never left empty while another carries two.
	targets = (index..<allTargets.size()).step(count).collect { allTargets[it] }
}
def gitCommit = providers.exec {
	commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
}.standardOutput.asText.getOrElse('').trim()

// ForgeGradle 5 (1.16.1 - 1.19.4) needs Gradle 7, which cannot run on Java 21.
// CI sets FORGE_JAVA_HOME to a JDK 17 installation; fall back to the current JVM.
def forgeJavaHome = System.getenv('FORGE_JAVA_HOME') ?: System.getenv('JAVA_HOME') ?: System.getProperty('java.home')

def readVersionProperty = { String versionDir, String key ->
	def properties = new Properties()
	file("${versionDir}/gradle.properties").withInputStream { properties.load(it) }
	properties.getProperty(key)
}

def targetVersion = { target ->
	def modVersion = readVersionProperty("versions/${target.name}", 'mod_version')
	if (target.loader == 'forge') {
		return "${modVersion}+forge-mc${target.minecraft}"
	}
	if (target.loader == 'neoforge') {
		return "${modVersion}+neoforge-mc${target.minecraft}"
	}
	return "${modVersion}+mc${target.minecraft}"
}
def targetJarBase = { target ->
	return "customsplash-${target.name}-${targetVersion(target)}"
}

def versionBuilds = targets.collect { target ->
	tasks.register("buildMc${target.name.replaceAll(/[^A-Za-z0-9_]/, '_')}", Exec) {
		def versionDirectory = file("versions/${target.name}")
		group = 'build'
		description = "Builds Custom Splash for ${target.loader} ${target.minecraft}."
		workingDir versionDirectory
		if (target.loader == 'forge') {
			// ForgeGradle 5/6 targets older JDKs, ForgeGradle 7 (1.20.6) needs
			// Java 21; pick the matching JDK for the child build.
			def targetJava = Integer.parseInt(readVersionProperty("versions/${target.name}", 'java_version'))
			def javaHome = targetJava >= 21 ? (System.getenv('JAVA_HOME_21_X64') ?: System.getenv('JAVA_HOME')) : forgeJavaHome
			if (javaHome) {
				environment 'JAVA_HOME', javaHome
			}
		} else if (target.loader == 'neoforge') {
			// ModDevGradle wants a JDK 21+ daemon; the 26.x toolchain comes from
			// org.gradle.java.installations.fromEnv in each project.
			def java21Home = System.getenv('JAVA_HOME_21_X64')
			if (java21Home) {
				environment 'JAVA_HOME', java21Home
			}
		}
		commandLine './gradlew', 'build', '--no-daemon'
		inputs.files(fileTree(versionDirectory) {
			include 'build.gradle', 'settings.gradle', 'gradle.properties', 'src/**'
		})
		inputs.property 'gitCommit', gitCommit
		outputs.dir file("versions/${target.name}/build/libs")
	}
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every supported Minecraft version.'
	dependsOn versionBuilds
}

tasks.register('collectJars', Sync) {
	group = 'build'
	description = 'Collects all version jars into build/releases.'
	dependsOn versionBuilds
	into layout.buildDirectory.dir('releases')
	targets.each { target ->
		from(fileTree("versions/${target.name}/build/libs")) {
			include "${targetJarBase(target)}${gitCommit ? ".${gitCommit}" : ''}.jar"
		}
	}
}

def checkModMetadata = { File jar, String metadataPath, String expectedVersion, String mcMarker ->
	new ZipFile(jar).withCloseable { zip ->
		def entry = zip.getEntry(metadataPath)
		if (entry == null) throw new GradleException("Missing ${metadataPath} in ${jar.name}")
		def text = zip.getInputStream(entry).getText('UTF-8')
		if (!text.contains('modId="customsplash"')) {
			throw new GradleException("Invalid ${metadataPath} in ${jar.name}")
		}
		if (!text.contains(mcMarker)) {
			throw new GradleException("Minecraft range in ${jar.name} does not start at ${mcMarker}")
		}
		def actual = text.readLines().find { it.startsWith('version="') }?.replaceFirst(/^version="(.*)"$/, '$1')
		if (actual != expectedVersion) {
			throw new GradleException("Invalid mod version in ${jar.name}: ${actual}")
		}
	}
}

tasks.register('verifyReleases') {
	group = 'verification'
	description = 'Checks that every selected version produced a valid mod jar.'
	dependsOn tasks.named('collectJars')
	doLast {
		def releases = layout.buildDirectory.dir('releases').get().asFile
		def jars = (releases.listFiles() ?: []).findAll { it.name.endsWith('.jar') }
		if (jars.size() != targets.size()) {
			throw new GradleException("Expected ${targets.size()} jars, found ${jars.size()}")
		}
		def platformClasses = [fabric: 'FabricSplashPlatform', forge: 'ForgeSplashPlatform', neoforge: 'NeoForgeSplashPlatform']
		targets.each { target ->
			def ver = targetVersion(target)
			def expectedName = "customsplash-${target.name}-${ver}${gitCommit ? ".${gitCommit}" : ''}.jar"
			def matches = jars.findAll { it.name == expectedName }
			if (matches.size() != 1) {
				throw new GradleException("Expected one jar for ${target.loader} ${target.minecraft}, found ${matches.size()}")
			}
			new ZipFile(matches[0]).withCloseable { zip ->
				if (zip.getEntry('dev/arrbrants/customsplash/SplashRegistry.class') == null) {
					throw new GradleException("Missing SplashRegistry class in ${matches[0].name}")
				}
				if (zip.getEntry('dev/arrbrants/customsplash/mixin/SplashManagerMixin.class') == null) {
					throw new GradleException("Missing splash mixin in ${matches[0].name}")
				}
				['SplashConfig', 'SplashEntry', 'SplashContext', 'SplashColors', 'SplashColor', 'SplashResourcePack', 'SplashPlatform'].each { className ->
					if (zip.getEntry("dev/arrbrants/customsplash/${className}.class") == null) {
						throw new GradleException("Missing ${className} class in ${matches[0].name}")
					}
				}
				def platformClass = platformClasses[target.loader]
				if (zip.getEntry("dev/arrbrants/customsplash/${platformClass}.class") == null) {
					throw new GradleException("Missing ${platformClass} class in ${matches[0].name}")
				}
				if (target.loader == 'fabric') {
					def entry = zip.getEntry('fabric.mod.json')
					if (entry == null) throw new GradleException("Missing fabric.mod.json in ${matches[0].name}")
					def metadata = new JsonSlurper().parse(zip.getInputStream(entry))
					if (metadata.depends.minecraft != fabricPredicate(target) ||
						metadata.version != "${ver}${gitCommit ? ".${gitCommit}" : ''}") {
						throw new GradleException("Invalid metadata in ${matches[0].name}")
					}
				} else if (target.loader == 'neoforge') {
					checkModMetadata(matches[0], 'META-INF/neoforge.mods.toml',
						"${ver}${gitCommit ? ".${gitCommit}" : ''}", mcLowerBound(target))
				} else {
					checkModMetadata(matches[0], 'META-INF/mods.toml',
						"${ver}${gitCommit ? ".${gitCommit}" : ''}", mcLowerBound(target))
				}
			}
		}
	}
}

tasks.named('build') {
	dependsOn tasks.named('verifyReleases')
	dependsOn tasks.named(':tests:test')
}

tasks.register('test') {
	group = 'verification'
	description = 'Runs the shared-source unit tests.'
	dependsOn ':tests:test'
}
